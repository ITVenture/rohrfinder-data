# On every push to main: move root-level CSV uploads into sites/,
# rebuild index.json, commit both, then deploy sites/ + index.json to
# GitHub Pages from this workflow. Pages source is "GitHub Actions"
# (not "deploy from a branch"): a branch deploy raced with the bot
# commit and the older build could overwrite the newer index. Pushes
# made with GITHUB_TOKEN do not re-trigger this workflow, so the bot
# commit cannot loop.
name: Build index and deploy

# No path filter: filters are case-sensitive and an upload named
# "Baustelle.CSV" in the root would not trigger. Runs on every push to
# main instead; when there is nothing to move or rebuild it exits fast.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # per-file commit dates for "updated"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Move root-level CSVs into sites/
        run: bash scripts/move-root-csvs.sh

      - name: Generate index.json
        run: node scripts/build-index.mjs

      - name: Commit moved files and index.json
        run: |
          git add -A -- sites index.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: move uploaded CSVs into sites/ and rebuild index.json"
          git push

      - name: Stage the published files
        run: |
          rm -rf _site
          mkdir -p _site/sites
          cp index.json _site/
          cp sites/*.csv _site/sites/ 2>/dev/null || true
          find _site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: index
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
